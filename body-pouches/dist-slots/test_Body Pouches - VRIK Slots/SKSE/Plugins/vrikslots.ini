###################################### Weapon Slot Configuration #######################################
# Slots are numbered as follows:
# 1=Left Hip,        2=Right Hip,        3=Left Thigh,    4=Right Thigh,    5=Left Calf,  6=Right Calf,
# 7=Left Upper Arm,  8=Right Upper Arm,  9=Left Forearm,  10=Right Forearm,
# 11=Left Shoulder,  12=Right Shoulder,  13=Stomach,      14=Chest

# Enables or disables all weapon holsters
enableHolsters = 1

# Locks or unlocks all weapon holsters
lockHolsters = 1

# Enables or disables haptic feedback
enableHaptics = 0

Adjusts the strength of the haptic pulse felt when bringing the hand over a weapon holster
hapticStrength = 4

# Toggles visibility of the vanilla Skyrim Quiver graphic
showQuiver = 0

# When weapons are sheathed, spells that were were previously equipped will be restored to the hands
restoreHeldSpells = 0

# Selects how the player exits combat stance (out of combat): 0=Never, 1=Hands Empty, 2=Only spells
exitCombatStance = 2

# When enabled, triggers are used for weapon holsters instead of the grip buttons
useTriggersInstead = 0

When enabled, the player must grip and pull from a holster in order to draw a weapon
requireWeaponDraw = 0

When enabled, the player can swap an equipped weapon with a holstered weapon
enableWeaponSwap = 1

When enabled, a blocked grip or trigger input that did NOT activate a holster will be repeated
repeatBlockedInputs = 0

# This gives the maximum distance from a hand to a slot needed to be in activation range
slotActivationDistance = 13

# This is distance multiplier for releasing a slot from hand locking in activation range. This value is multiplied with activation distance to find the value.
slotChangeDistanceMultiplier = 1.7500000

# Shows a virtual sphere as a visual indicator that a holster is being hovered.
showHolsterHoverSphere = 0

# Shows hover spheres while weapons are sheathed.
sheathedHoverSpheres = 1

# Shows hover spheres while in combat.
combatHoverSpheres = 0

# This is the scale of the hover sphere. This is multiplied by the activation distance.
hoverSphereScale = 1.0000000

# This is the opacity of the hover sphere. Default value is 0.2. 1.0 would make it completely opaque.
hoverSphereOpacity = 0.2500000

# This is the color of the hover sphere. Red = 0, Green = 1, Blue = 2, Yellow = 3, Magenta = 4,
# Cyan = 5, Orange = 6, Purple = 7, Lime = 8, Pink = 9, Sky Blue = 10, Gray = 11, Olive = 12, Teal = 13.
hoverSphereColor = 13

# This is the emmisive color multiplier of the hover sphere. Default value is 2.0.
hoverSphereColorMultiplier = 2.0000000

